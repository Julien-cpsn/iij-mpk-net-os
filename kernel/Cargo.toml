[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.15"
x86_64 = "=0.15.4"
linked_list_allocator = "0.10.6"

acpi = "5.2.0"
pic8259 = "0.11.0"
uart_16550 = "0.6.0"
# Logless version
virtio-drivers = { version = "0.13.0", path = "../../virtio-drivers" } #git = "https://github.com/Julien-cpsn/virtio-drivers"

spin = { version = "0.12.2", features = ["lazy"] }
accessor = "0.3.3"
aligned-vec = { version = "0.6.4", default-features = false}
crossbeam-queue = { version = "0.3.13", default-features = false, features = ["alloc"] }

strum_macros = "0.28.0"
humansize = "2.1.3"
log = "0.4.33"
backtrace = { version = "0.3.76", default-features = false }

[dependencies.smoltcp]
version = "0.13.1"
default-features = false
features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "auto-icmp-echo-reply"]

[build-dependencies]
cc = "1.2.67"