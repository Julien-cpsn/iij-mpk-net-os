[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.15"
x86_64 = "0.15.4"
linked_list_allocator = "0.10.6"
raw-cpuid = { version = "11.6.0", default-features = false }

acpi = "5.2.0"
pic8259 = "0.11.0"
uart_16550 = "0.6.0"
virtio-drivers = { version = "0.13.0" }

spin = { version = "0.12.1", features = ["lazy"] }
accessor = "0.3.3"
strum_macros = "0.28.0"
humansize = "2.1.3"
aligned-vec = { version = "0.6.4", default-features = false}
goolog = "0.11.0"
log = "0.4.33"

[dependencies.smoltcp]
version = "0.13.1"
default-features = false
features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "auto-icmp-echo-reply"]